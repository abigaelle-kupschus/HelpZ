<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuisine de Hyrule</title>
<style>
:root{--bg:#f6f1e4;--card:#fffdf6;--ink:#2b2a24;--mut:#7a7667;--acc:#2f7d6b;--line:#e3dccb;--red:#d6453d}
@media(prefers-color-scheme:dark){:root{--bg:#171a18;--card:#202522;--ink:#ece8da;--mut:#9a9684;--acc:#5cc2a8;--line:#323833;--red:#ee6a62}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:1.4rem;margin:4px 0 12px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input,select,textarea{width:100%}button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}.chips button{white-space:nowrap;padding:6px 12px;border-radius:99px}.chips .on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.pic{width:64px;height:64px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:34px;overflow:hidden;flex:none}.pic img{width:100%;height:100%;object-fit:cover}
.card h3{margin:0 0 2px;font-size:1.05rem}.heart{color:var(--red);letter-spacing:1px}.mut{color:var(--mut);font-size:.9rem}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:.8rem;margin:3px 4px 0 0}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}.row .s{flex:none}
.hs{display:inline-flex;flex-wrap:wrap;gap:2px;vertical-align:middle}.hs svg{width:18px;height:17px}.qn{width:72px;text-align:center}.nm{flex:1;align-self:center}h4{margin:16px 0 6px;font-size:.95rem}.hl{border:1px solid var(--acc);border-radius:12px;padding:6px;background:var(--card)}.ok{color:var(--acc);font-weight:600}.mini{padding:4px 10px;font-size:.85rem}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,440px)}
dialog label{display:block;margin:8px 0 3px;font-size:.85rem;color:var(--mut)}
</style></head><body>
<h1>🍲 Cuisine de Hyrule</h1>
<div class="tabs"><button id="t1" class="on">Recettes</button><button id="t2">Inventaire</button><button id="t3">Plan</button></div>

<section id="v1">
  <div class="row"><input id="q" type="search" placeholder="Chercher un ingrédient ou un plat (ex : carotte)"><button class="p s" id="add">+ Recette</button></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</section>

<section id="v2" hidden>
  <div class="row"><input id="in" placeholder="Ingrédient (ex : Carotte)" autocomplete="off"><input id="iq" type="number" min="1" value="1" style="max-width:80px"><button class="p s" id="ia">Ajouter</button></div>
  <div class="chips" id="sg" style="padding-top:0"></div>
  <div class="row"><select id="ig"><option value="">Type : détection auto</option><option>Viande</option><option>Poisson</option><option>Fruits</option><option>Légumes</option><option>Champignons</option><option>Plantes</option><option>Monstre</option><option>Insecte</option><option>Autre</option></select></div>
  <div id="inv"></div>
</section>

<section id="v3" hidden>
  <div class="row"><label class="mut">❤️ Mes cœurs<input id="mh" type="number" min="3" max="30"></label><label class="mut">Marge (+)<input id="mm" type="number" min="0"></label></div>
  <p class="mut">Seules les recettes qui restaurent au plus « cœurs + marge » sont proposées. « Fait 1 fois » retire les ingrédients.</p>
  <div id="plan"></div>
</section>

<dialog id="dlg"><form method="dialog" id="f">
  <h3 id="ft">Nouvelle recette</h3>
  <label>Nom</label><input id="fn" required>
  <label>Emoji</label><input id="fe" maxlength="4" value="🍲">
  <label>URL de l'image (facultatif)</label><input id="fi" placeholder="https://…">
  <label>Ingrédients (un par ligne, ex : Carotte x2 ; ou [Viande], [Fruits], [Monstre]… pour « n'importe lequel »)</label><textarea id="fg" rows="4" required></textarea>
  <label>Cœurs restaurés</label><input id="fh" type="number" step="0.25" min="0" value="1">
  <label>Catégorie de bonus</label><select id="fc"></select>
  <label>Détail du bonus (facultatif)</label><input id="fb" placeholder="ex : Résistance au froid, niveau 1">
  <div class="row" style="margin-top:14px"><button type="button" id="fx">Annuler</button><button class="p" id="fs">Enregistrer</button></div>
</form></dialog>

<script>
const CATS={froid:"❄️ Contre le froid",chaleur:"🔥 Contre la chaleur",force:"💪 Force",defense:"🛡️ Défense",vitesse:"💨 Vitesse",furtivite:"🥷 Furtivité",endurance:"⚡ Endurance",elec:"🌩️ Anti-électricité",coeurs:"💖 Cœurs bonus",aucun:"Sans bonus"};
const SEED=[];

let R=JSON.parse(localStorage.getItem("botw_r")||"null")||SEED;
let INV=JSON.parse(localStorage.getItem("botw_i")||"{}");
let cat="all",editing=null;
let H=+localStorage.getItem("botw_h")||3,M=localStorage.getItem("botw_m")===null?2:+localStorage.getItem("botw_m");
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{localStorage.setItem("botw_r",JSON.stringify(R));localStorage.setItem("botw_i",JSON.stringify(INV));localStorage.setItem("botw_t",JSON.stringify(T))};
const HP="M12 21s-9-6.2-9-12.2C3 5 5.6 3 8.3 3c1.7 0 3.1.9 3.7 2.2C12.6 3.9 14 3 15.7 3 18.4 3 21 5 21 8.8 21 14.8 12 21 12 21z";
const hearts=h=>{if(!h)return'<span class="mut">—</span>';const n=Math.min(Math.ceil(h),10);let o='<span class="hs">';for(let i=0;i<n;i++){const p=Math.max(0,Math.min(1,h-i));o+=`<svg viewBox="0 0 24 22"><path d="${HP}" fill="var(--line)"/><path d="${HP}" fill="var(--red)" style="clip-path:inset(0 ${(1-p)*100}% 0 0)"/></svg>`}return o+(h>10?` <b>+${+(h-10).toFixed(2)}</b>`:"")+`</span> <span class="mut">${h}</span>`};
const lbl=n=>{const m=n.match(/^\[(.+)\]$/);return m?m[1]+" (au choix)":n};
let T=JSON.parse(localStorage.getItem("botw_t")||"{}");
const CATI={Viande:"🥩",Poisson:"🐟",Fruits:"🍎",Légumes:"🥕",Champignons:"🍄",Plantes:"🌿",Monstre:"👹",Insecte:"🐞",Autre:"📦"};
const CR=[["Monstre",/croc|corne|griffe|aile|oeil|œil|queue|gelee|bokoblin|moblin|lezalfos|hinox|keese|chuchu|octorok|molduga|wizzrobe|lynel/],["Insecte",/grenouille|lezard|luciole|libellule|sauterelle|criquet|scarabee|papillon|fourmi|cigale|escargot|limace|cafard|coccinelle|grillon/],["Champignons",/champignon|shroom|truffe/],["Viande",/viande|gigot|cuisse|volaille|poulet|steak|jambon/],["Poisson",/poisson|saumon|truite|carpe|esturgeon|dorade|thon|\bbar\b/],["Légumes",/carotte|radis|poireau|chou|courge|poivron|navet|tomate|oignon|citrouille|piment|pomme de terre/],["Fruits",/pomme|banane|noix de coco|melon|baie|raisin|cerise|orange|fruit|citron|poire|peche/],["Plantes",/chardon|armoranth|nigelle|safflina|herbe|fleur|lys|plante|racine|noix|gland|feuille|menthe/]];
const gOf=k=>T[norm(k)]||(CR.find(([,r])=>r.test(norm(k)))||[""])[0];
function invHTML(){
  const q=norm($("in").value);let ks=Object.keys(INV),head="";
  if(!ks.length)return'<p class="mut">Ajoute ce que tu as sur toi.</p>';
  if(q){const m=ks.filter(k=>norm(k).includes(q));
    if(!m.length)return`<p class="mut">« ${esc($("in").value.trim())} » n'est pas encore dans ton inventaire.</p>`;
    ks=m;head='<p class="ok">✔ Déjà dans ton inventaire :</p>'}
  const row=k=>`<div class="row inv${q?" hl":""}"><span class="nm">${esc(k)}</span><button class="mini s" data-m="${esc(k)}">−</button><input class="s qn" type="number" min="0" value="${INV[k]}" data-q="${esc(k)}"><button class="mini s" data-p="${esc(k)}">+</button><button class="mini s" data-x="${esc(k)}">🗑️</button></div>`;
  const by={};ks.sort((a,b)=>norm(a).localeCompare(norm(b))).forEach(k=>{const c=gOf(k)||"Autre";(by[c]=by[c]||[]).push(k)});
  return head+Object.keys(CATI).filter(c=>by[c]).map(c=>`<h4>${CATI[c]} ${c} <span class="mut">(${by[c].length})</span></h4>`+by[c].map(row).join("")).join("");
}
function take(r,inv){const c={...inv};for(const i of r.ing){let need=i.q;const g=i.n.match(/^\[(.+)\]$/);const ks=Object.keys(c).filter(k=>g?norm(gOf(k))===norm(g[1]):norm(k)===norm(i.n)).sort((a,b)=>c[b]-c[a]);for(const k of ks){const t=Math.min(need,c[k]);c[k]-=t;need-=t;if(!need)break}if(need)return null}return c}

if(localStorage.getItem("botw_v")!=="3"){R=R.filter(r=>!/^s\d+$/.test(r.id));localStorage.setItem("botw_v","3");save()}
function ingNames(){return[...new Set(R.flatMap(r=>r.ing.map(i=>i.n)))].sort()}
function sorted(a){return a.sort((x,y)=>y.hearts-x.hearts||(y.bonus!=="aucun")-(x.bonus!=="aucun")||x.ing.length-y.ing.length)}

function card(r,extra=""){
  return `<div class="card"><div class="pic">${r.img?`<img src="${esc(r.img)}" alt="" onerror="this.remove()">`:esc(r.emoji)}</div>
  <div style="flex:1"><h3>${esc(r.name)}</h3><div class="heart">${hearts(r.hearts)}</div>
  <div>${r.ing.map(i=>`<span class="tag">${esc(lbl(i.n))}${i.q>1?" ×"+i.q:""}</span>`).join("")}</div>
  ${r.bonus!=="aucun"?`<div class="mut">${CATS[r.bonus]}${r.bonusTxt?" · "+esc(r.bonusTxt):""}</div>`:""}${extra}</div></div>`}

function render(){
  $("chips").innerHTML=[["all","Tout"],...Object.entries(CATS)].map(([k,v])=>`<button data-c="${k}" class="${cat===k?"on":""}">${v}</button>`).join("");
  const q=norm($("q").value);
  let L=R.filter(r=>(cat==="all"||r.bonus===cat)&&(!q||norm(r.name).includes(q)||r.ing.some(i=>norm(i.n).includes(q))));
  $("list").innerHTML=sorted(L).map((r,i)=>card(r,`<div style="margin-top:6px"><button class="mini" data-e="${r.id}">✏️ Modifier</button> <button class="mini" data-d="${r.id}">🗑️</button></div>`)).join("")||(R.length?'<p class="mut">Aucune recette trouvée.</p>':'<p class="mut">Aucune recette pour l\'instant. Ajoute la première avec « + Recette ».</p>');
  $("inv").innerHTML=invHTML();
  $("plan").innerHTML=plan();
}

function plan(){
  let inv={...INV};const steps={};let total=0;
  for(let n=0;n<60;n++){
    const best=sorted(R.filter(r=>r.hearts<=H+M&&take(r,inv)))[0];
    if(!best)break;
    inv=take(best,inv);
    steps[best.id]=(steps[best.id]||0)+1;total+=best.hearts;
  }
  const ids=Object.keys(steps);
  if(!ids.length)return'<p class="mut">Aucune recette possible avec cet inventaire et ce nombre de cœurs.</p>';
  return `<p class="ok">Total : ${total} cœurs</p>`+ids.map(id=>{const r=R.find(x=>x.id===id);return card(r,`<div class="ok">À cuisiner ×${steps[id]}</div><button class="p mini" data-f="${id}">✅ Fait 1 fois</button>`)}).join("");
}

function open(r){
  editing=r?r.id:null;$("ft").textContent=r?"Modifier la recette":"Nouvelle recette";
  $("fc").innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  $("fn").value=r?r.name:"";$("fe").value=r?r.emoji:"🍲";$("fi").value=r?r.img:"";
  $("fg").value=r?r.ing.map(i=>i.n+(i.q>1?" x"+i.q:"")).join("\n"):"";
  $("fh").value=r?r.hearts:1;$("fc").value=r?r.bonus:"aucun";$("fb").value=r?r.bonusTxt:"";
  $("dlg").showModal();
}
$("f").addEventListener("submit",()=>{
  const ing=$("fg").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\s*[x×]\s*(\d+)$/i);return m?{n:m[1],q:+m[2]}:{n:l,q:1}});
  const o={id:editing||"c"+Date.now(),name:$("fn").value.trim(),emoji:$("fe").value||"🍲",img:$("fi").value.trim(),ing,hearts:+$("fh").value||0,bonus:$("fc").value,bonusTxt:$("fb").value.trim()};
  editing?R=R.map(r=>r.id===editing?o:r):R.push(o);
  save();render();
});
$("fx").onclick=()=>$("dlg").close();
$("add").onclick=()=>open();
$("q").oninput=render;
$("mh").value=H;$("mm").value=M;
$("mh").oninput=$("mm").oninput=()=>{H=+$("mh").value||0;M=+$("mm").value||0;localStorage.setItem("botw_h",H);localStorage.setItem("botw_m",M);render()};
["1","2","3"].forEach(n=>$("t"+n).onclick=()=>{["1","2","3"].forEach(m=>{$("v"+m).hidden=m!==n;$("t"+m).className=m===n?"on":""});render()});
$("in").oninput=()=>{
  const q=norm($("in").value);
  $("sg").innerHTML=q?ingNames().filter(n=>norm(n).includes(q)&&norm(n)!==q).slice(0,6).map(n=>`<button data-s="${esc(n)}">${esc(n)}</button>`).join(""):"";
  render();
};
$("ia").onclick=()=>{$("sg").innerHTML="";const n=$("in").value.trim();if(!n)return;const k=Object.keys(INV).find(x=>norm(x)===norm(n))||n;INV[k]=(INV[k]||0)+(+$("iq").value||1);if($("ig").value)T[norm(k)]=$("ig").value;$("in").value="";$("iq").value=1;save();render()};
document.body.addEventListener("click",e=>{
  const t=e.target,g=a=>t.dataset[a];
  if(g("s")){$("in").value=g("s");$("sg").innerHTML="";render();return}
  if(g("c"))cat=g("c");
  else if(g("e"))return open(R.find(r=>r.id===g("e")));
  else if(g("d")){if(confirm("Supprimer cette recette ?"))R=R.filter(r=>r.id!==g("d"))}
  else if(g("m")){INV[g("m")]--;if(INV[g("m")]<=0)delete INV[g("m")]}
  else if(g("p"))INV[g("p")]++;
  else if(g("f")){const c=take(R.find(r=>r.id===g("f")),INV);if(c)INV=Object.fromEntries(Object.entries(c).filter(([,v])=>v>0))}
  else if(g("x"))delete INV[g("x")];
  else return;
  save();render();
});
document.body.addEventListener("change",e=>{
  const k=e.target.dataset.q;if(k===undefined)return;
  const v=Math.max(0,Math.floor(+e.target.value||0));
  if(v)INV[k]=v;else delete INV[k];
  save();render();
});
render();
</script></body></html>
